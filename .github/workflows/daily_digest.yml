name: Weekly AI/ML News Digest

on:
  schedule:
    # Runs every day at 7:00 AM UTC to accumulate articles.
    # On SEND_DAY (set in config.py), it also sends the email.
    #
    # To change the send TIME, edit the hour below (0–23 UTC):
    - cron: "0 7 * * *"
  workflow_dispatch:   # Manual trigger from the Actions tab

permissions:
  contents: write      # Needed to commit the data store back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python src/main.py

      - name: Commit data store
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update article store $(date -u '+%Y-%m-%d')"
            git push
          fi
