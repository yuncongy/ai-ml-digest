name: Daily AI/ML News Digest

on:
  schedule:
    - cron: "0 7 * * *"   # Every day at 7:00 AM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write           # Needed to commit the digest back to the repo

jobs:
  build-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        run: python src/main.py

      - name: Commit digest and seen-articles store
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ data/seen_articles.json

          # Only commit if there is something new to commit
          if git diff --cached --quiet; then
            echo "Nothing new to commit — skipping."
          else
            git commit -m "digest: $(date -u '+%Y-%m-%d') daily AI/ML news update"
            git push
          fi
